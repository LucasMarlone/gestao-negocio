
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Gestão de Negócio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f5f9;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px #00000012;
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: 1px solid #94a3b8;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #1d4ed8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        .erro {
            color: #b91c1c;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="login">

    <h1>Gestão de Negócio</h1>

    <form method="post">
        {% csrf_token %}

        <label for="username">Usuário</label>
        <input
            type="text"
            name="username"
            id="username"
            required
            autofocus
        >

        <label for="password">Senha</label>
        <input
            type="password"
            name="password"
            id="password"
            required
        >

        {% if form.errors %}
            <p class="erro" role="alert">
                Usuário ou senha incorretos.
            </p>
        {% endif %}

        <button type="submit">
            Entrar no sistema
        </button>
    </form>

</div>

</body>
</html>
